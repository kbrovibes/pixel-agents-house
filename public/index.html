<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pixel Agents">
<meta name="theme-color" content="#f4f4f1">
<title>Pixel Agents House</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="world" aria-label="Pixel Agents House"></canvas>

<div id="chrome">
  <div id="brandpill" class="hud">
    <span class="dot" id="liveDot" title="Disconnected"></span>
    <h1>Pixel Agents House</h1>
    <span class="count" id="agentCount">0 agents</span>
  </div>
  <div id="actions" class="hud">
    <div class="seg" id="floorsSeg" role="group" aria-label="Floors">
      <button type="button" data-mode="auto" class="on" title="Main floor, upper floor as picture-in-picture when in use (0)">Auto</button>
      <button type="button" data-mode="main" title="Main floor only (1)">Main</button>
      <button type="button" data-mode="split" title="Both floors side by side (2)">Split</button>
    </div>
    <button type="button" class="btn" id="btnLabels" title="Room labels (L)">Labels</button>
    <button type="button" class="btn" id="btnFull" title="Fullscreen (F)">Fullscreen</button>
    <button type="button" class="btn" id="btnHide" title="Hide UI (H)">Hide UI</button>
  </div>

  <aside id="roster">
    <div class="panel-head">
      <span>Agents</span>
      <button type="button" id="rosterToggle" class="icon" aria-label="Collapse">&#8963;</button>
    </div>
    <ul id="rosterList"></ul>
    <div class="empty" id="rosterEmpty">No live sessions yet.<br>Start <code>claude</code> in any terminal.</div>
  </aside>

  <section id="details" hidden></section>

  <aside id="legend">
    <div id="stats"></div>
    <div id="ticker"></div>
    <div id="addr" hidden title="Where this page is served from"></div>
  </aside>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
